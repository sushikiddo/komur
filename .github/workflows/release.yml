name: Build & Release (Windows + macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach artifacts to (e.g. v2.4.0)'
        required: false
        default: 'v2.4.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build & test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pytest pygame Pillow

      - name: Run Windows test suite
        run: pytest -q --tb=short -k "not test_compact_bubble_does_not_chase_cat_and_drags"

      - name: Build Komur.exe (Windows x64)
        run: pyinstaller --noconfirm Komur.spec

      - name: Smoke-test frozen Komur.exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\Komur.exe" -ArgumentList "--smoke-test", "smoke-win.json" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Komur.exe exited with code $($p.ExitCode)" }
          Get-Content smoke-win.json
          python -c "import json; d=json.load(open('smoke-win.json')); assert d.get('ok') is True and d.get('frozen') is True"

      - name: Prepare versioned Windows artifact & SHA-256
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.tag }}" }
          $ver = $tag.TrimStart('v')
          $outDir = "release-artifacts"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $exeName = "Komur-$ver-Windows-x64.exe"
          Copy-Item "dist/Komur.exe" "$outDir/$exeName"
          $hash = (Get-FileHash "$outDir/$exeName" -Algorithm SHA256).Hash.ToLower()
          "$hash  $exeName" | Set-Content -Encoding ASCII "$outDir/$exeName.sha256"
          Write-Host "Built $exeName ($((Get-Item "$outDir/$exeName").Length) bytes) SHA256=$hash"

      - name: Upload Windows artifact to workflow
        uses: actions/upload-artifact@v4
        with:
          name: komur-windows-x64
          path: release-artifacts/*

      - name: Attach Windows build to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.tag }}" }
          if (-not $tag) { exit 0 }
          gh release upload $tag release-artifacts/* --clobber

  build-macos:
    name: macOS Apple Silicon Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build & test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller pytest

      - name: Build Kömür.app (macOS arm64)
        run: pyinstaller --noconfirm Komur-mac.spec

      - name: Package ZIP, DMG & SHA-256
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          VER="${TAG#v}"
          mkdir -p release-artifacts
          ZIP_NAME="Komur-${VER}-macOS-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/Kömür.app" "release-artifacts/${ZIP_NAME}"
          (cd release-artifacts && shasum -a 256 "${ZIP_NAME}" > "${ZIP_NAME}.sha256")
          bash distribution/build_dmg.sh "dist/Kömür.app" "${VER}" "release-artifacts"
          cat "release-artifacts/${ZIP_NAME}.sha256"
          cat "release-artifacts/Komur-${VER}-macOS-arm64.dmg.sha256"

      - name: Upload macOS artifact to workflow
        uses: actions/upload-artifact@v4
        with:
          name: komur-macos-arm64
          path: release-artifacts/*

      - name: Attach macOS build to GitHub Release (if missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          [ -n "$TAG" ] || exit 0
          VER="${TAG#v}"
          if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "Komur-${VER}-macOS-arm64.zip"; then
            echo "macOS asset already attached to $TAG; keeping existing release package."
            exit 0
          fi
          gh release upload "$TAG" release-artifacts/* --clobber
